[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "treediagram-workbench"
dynamic = ["version"]
description = "Offline six-degree-of-freedom engineering workbench"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "numpy>=2.4.1,<3", "scipy>=1.16.3,<2", "jsonschema>=4.23,<5", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
treediagram = "treediagram.app:App_Main"
treediagram-cli = "treediagram.cli:Cli_Main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "treediagram.__version__"}

[tool.setuptools.package-data]
treediagram = ["algorithms/native/*.c", "algorithms/native/*.h", "algorithms/sdk/**/*", "algorithms/sdk/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.test-tmp -p no:cacheprovider"

