name: Bounded host core and contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check changed files only
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_repository_artifacts.py --base "$DIFF_BASE"
      - run: sudo apt-get update && sudo apt-get install -y gcc libegl1 libopengl0
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_algorithms.py tests/test_physics.py tests/test_imports.py tests/test_storage.py -q
